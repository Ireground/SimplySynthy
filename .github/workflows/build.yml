name: Build SimplySynthy

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SimplySynthy-VST3-Windows
          path: build/SimplySynthy_artefacts/Release/VST3/

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --verbose --timeout-ms 600000 --output-dir pluginval-logs --validate "build/SimplySynthy_artefacts/Release/VST3/SimplySynthy.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Diagnostic build (only if pluginval failed)
        if: failure()
        shell: pwsh
        run: |
          cmake -B diag -A x64 -DSS_DIAG=ON
          cmake --build diag --config RelWithDebInfo --parallel
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --verbose --timeout-ms 600000 --validate "diag/SimplySynthy_artefacts/RelWithDebInfo/VST3/SimplySynthy.vst3" 2>&1 | Select-Object -Last 120
          Get-ChildItem pluginval-logs -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 60 }

      - name: Upload pluginval log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-log
          path: pluginval-logs/
