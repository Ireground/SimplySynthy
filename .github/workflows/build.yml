name: Build SimplySynthy

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SimplySynthy-VST3-Windows
          path: build/SimplySynthy_artefacts/Release/VST3/

      - name: pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --verbose --validate "build/SimplySynthy_artefacts/Release/VST3/SimplySynthy.vst3" 2>&1 | Tee-Object -FilePath pluginval-log.txt | Select-Object -Last 40
          $code = $LASTEXITCODE
          echo "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }
