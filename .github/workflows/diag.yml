name: Diagnose

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
      - name: Build A (Release, symbols, same linker opts, crash handler)
        run: |
          cmake -B buildA -A x64 -DSS_DIAG=ON -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /W3 /GR /EHsc /Zi" -DCMAKE_MODULE_LINKER_FLAGS="/DEBUG /OPT:REF /OPT:ICF" -DCMAKE_SHARED_LINKER_FLAGS="/DEBUG /OPT:REF /OPT:ICF"
          cmake --build buildA --config Release --parallel
      - name: Build B (plain Release)
        run: |
          cmake -B buildB -A x64
          cmake --build buildB --config Release --parallel
      - name: Run A
        shell: pwsh
        continue-on-error: true
        run: |
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --verbose --validate "buildA/SimplySynthy_artefacts/Release/VST3/SimplySynthy.vst3" 2>&1 | Select-Object -Last 60
          echo "exit A $LASTEXITCODE"
      - name: Run B
        shell: pwsh
        continue-on-error: true
        run: |
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --verbose --validate "buildB/SimplySynthy_artefacts/Release/VST3/SimplySynthy.vst3" 2>&1 | Select-Object -Last 30
          echo "exit B $LASTEXITCODE"
      - name: Run B again
        shell: pwsh
        continue-on-error: true
        run: |
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --verbose --validate "buildB/SimplySynthy_artefacts/Release/VST3/SimplySynthy.vst3" 2>&1 | Select-Object -Last 30
          echo "exit B2 $LASTEXITCODE"
