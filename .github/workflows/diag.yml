name: Diagnose

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release with symbols + crash handler
        run: |
          cmake -B build -A x64 -DSS_DIAG=ON -DCMAKE_CXX_FLAGS="/Zi" -DCMAKE_SHARED_LINKER_FLAGS="/DEBUG" -DCMAKE_MODULE_LINKER_FLAGS="/DEBUG"
          cmake --build build --config Release --parallel
      - name: pluginval in-process (Release)
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --verbose --skip-gui-tests --validate "build/SimplySynthy_artefacts/Release/VST3/SimplySynthy.vst3" 2>&1 | Select-Object -Last 5
          echo "=== WITH GUI ==="
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --verbose --validate "build/SimplySynthy_artefacts/Release/VST3/SimplySynthy.vst3" 2>&1 | Select-Object -Last 80
          echo "exit $LASTEXITCODE"
